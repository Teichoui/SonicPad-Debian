name: Shellcheck

on:
  # No path filter on the trigger: the job needs to always run and
  # report a status in case this is ever made a required check - a
  # path-filtered-out check stays permanently pending on non-matching
  # PRs and blocks merges under branch protection (same reasoning as
  # build.yml). The steps below already skip cleanly when nothing
  # relevant changed.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed shell scripts
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              git diff -z --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.sh' > changed.txt
              ;;
            push)
              git diff -z --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" -- '*.sh' > changed.txt || git ls-files -z '*.sh' > changed.txt
              ;;
            *)
              git ls-files -z '*.sh' > changed.txt
              ;;
          esac
          echo "Files to check:"
          tr '\0' '\n' < changed.txt

      - name: Run ShellCheck on changed files
        run: |
          if [ -s changed.txt ]; then
            xargs -0 -a changed.txt shellcheck --severity=warning
          else
            echo "No shell scripts changed."
          fi
