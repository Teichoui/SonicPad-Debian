name: Shellcheck

on:
  pull_request:
    paths:
      - '**.sh'
  push:
    branches: [main]
    paths:
      - '**.sh'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
