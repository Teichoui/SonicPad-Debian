name: Shellcheck

on:
  # No path filter on the trigger: the job needs to always run and
  # report a status in case this is ever made a required check - a
  # path-filtered-out check stays permanently pending on non-matching
  # PRs and blocks merges under branch protection (same reasoning as
  # build.yml). The steps below already skip cleanly when nothing
  # relevant changed.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed shell scripts
        id: filter
        run: |
          workflow_changed=""
          full_scan=false
          case "${{ github.event_name }}" in
            pull_request)
              git diff -z --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.sh' > changed.txt
              workflow_changed="$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '.github/workflows/shellcheck.yml')"
              ;;
            push)
              git diff -z --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" -- '*.sh' > changed.txt || git ls-files -z '*.sh' > changed.txt
              workflow_changed="$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" -- '.github/workflows/shellcheck.yml' 2>/dev/null || true)"
              ;;
            *)
              git ls-files -z '*.sh' > changed.txt
              full_scan=true
              ;;
          esac
          if [ -n "$workflow_changed" ]; then
            # This workflow file itself changed - a diff against '*.sh'
            # won't touch any actual script, but a broken shellcheck
            # command/filter change should still fail a real check
            # rather than merge with nothing ever actually invoked.
            echo "shellcheck.yml changed - checking all shell scripts to actually exercise the check."
            git ls-files -z '*.sh' > changed.txt
            full_scan=true
          fi
          echo "full_scan=$full_scan" >> "$GITHUB_OUTPUT"
          echo "Files to check:"
          tr '\0' '\n' < changed.txt

      - name: Run ShellCheck on changed files
        run: |
          if [ ! -s changed.txt ]; then
            echo "No shell scripts changed."
            exit 0
          fi
          if [ "${{ steps.filter.outputs.full_scan }}" = "true" ]; then
            # Repo-wide scan (manual/scheduled run, or this workflow file
            # itself changed) - the repo has pre-existing warning-level
            # debt unrelated to any given change, so only fail on actual
            # errors here. Real PRs that touch specific scripts still get
            # the stricter warning-level check above.
            xargs -0 -a changed.txt shellcheck --severity=error
          else
            xargs -0 -a changed.txt shellcheck --severity=warning
          fi
