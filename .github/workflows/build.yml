name: Build Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catches drift from the live Debian mirror (debootstrap/apt pull
    # latest packages) breaking the build even with no local changes.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether the build is actually affected
        # The job always runs (no path filter on the trigger) so this can
        # be used as a required status check - a path-filtered-out check
        # stays permanently pending on non-matching PRs and blocks merges
        # under branch protection. Instead, always report a status, and
        # only skip the expensive build steps when nothing that affects
        # the build changed (docs-only PRs, other workflows, etc). This
        # workflow file itself counts - a PR that breaks these commands
        # should not be able to merge with a green check that never
        # actually ran them.
        id: filter
        run: |
          PATHS=('src/**' '.github/workflows/build.yml')
          case "${{ github.event_name }}" in
            pull_request)
              changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "${PATHS[@]}")"
              ;;
            push)
              changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "${PATHS[@]}" 2>/dev/null || echo "${PATHS[0]}")"
              ;;
            *)
              changed="${PATHS[0]} (scheduled or manually dispatched run)"
              ;;
          esac
          if [ -n "$changed" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            echo "No src/** changes - skipping full build."
          fi

      - name: Install 32-bit runtime for the bundled dragon packer
        if: steps.filter.outputs.run_build == 'true'
        # prebuilt_kernel/tools/dragon (used by pack_img.sh) is a 32-bit
        # x86 ELF binary - ubuntu-latest doesn't have i386 library support
        # enabled by default, so it fails with a misleading
        # "No such file or directory" even though the file exists.
        # Documented in README.md's build troubleshooting section.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Add the credentials (C) flag to the aarch64 binfmt registration
        if: steps.filter.outputs.run_build == 'true'
        # Debian's own qemu-user-static postinst registers a correct
        # magic/mask for aarch64, but without the C (credentials) flag -
        # without it, sudo silently fails inside the qemu-emulated chroot
        # ("effective uid is not 0"), so Klipper/Moonraker/KlipperScreen/
        # etc never actually get installed even though the build
        # "succeeds". Documented in README.md's troubleshooting section;
        # `update-binfmts --disable/--enable` doesn't reliably fix this,
        # manual re-registration is required.
        #
        # Installing the package here (rather than letting
        # create_rootfs.sh's own `apt-get install qemu-user-static` do it
        # first) means that later call is a true no-op and won't re-run
        # the postinst and clobber this fix.
        #
        # Extracting the magic/mask/interpreter Debian already generated
        # and only appending the missing flag - rather than hand-typing a
        # byte pattern - matters: an earlier hand-typed pattern here
        # accidentally matched the *host's own* x86_64 binaries too and
        # broke grep/node mid-job ("Exec format error" on tools that have
        # nothing to do with the build). Reusing Debian's own generated,
        # already-correct-for-this-exact-package-version pattern avoids
        # that risk entirely.
        run: |
          set -e
          sudo apt-get install -y qemu-user-static
          entry=/proc/sys/fs/binfmt_misc/qemu-aarch64
          test -f "$entry" || { echo "qemu-aarch64 binfmt entry not found after installing qemu-user-static"; exit 1; }
          current_flags=$(awk '/^flags/{print $2}' "$entry")
          echo "Current flags: $current_flags"
          case "$current_flags" in
            *C*)
              echo "C flag already present, nothing to do."
              ;;
            *)
              magic_hex=$(awk '/^magic/{print $2}' "$entry")
              mask_hex=$(awk '/^mask/{print $2}' "$entry")
              interp=$(awk '/^interpreter/{print $2}' "$entry")
              [ -n "$magic_hex" ] && [ -n "$mask_hex" ] && [ -n "$interp" ] || { echo "Could not read magic/mask/interpreter from $entry"; cat "$entry"; exit 1; }
              magic_esc=$(echo "$magic_hex" | sed 's/\(..\)/\\x\1/g')
              mask_esc=$(echo "$mask_hex" | sed 's/\(..\)/\\x\1/g')
              echo -1 | sudo tee "$entry" >/dev/null
              printf ":qemu-aarch64:M::${magic_esc}:${mask_esc}:${interp}:${current_flags}C\n" \
                | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
              ;;
          esac
          grep -i '^flags' "$entry"

      - name: Run full build (create_rootfs + pack_img)
        if: steps.filter.outputs.run_build == 'true'
        working-directory: src
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # install_webui.sh prompts whether to also install Fluidd
          # alongside Mainsail - answer "no" so the build doesn't hang
          # waiting on stdin that will never come in CI.
          echo "n" | sudo -E ./build.sh

      - name: Verify output image exists
        if: steps.filter.outputs.run_build == 'true'
        working-directory: src
        run: |
          test -f out/debian_r818_sonic_lcd_uart0.img
          ls -lh out/debian_r818_sonic_lcd_uart0.img

      - name: Upload built image
        if: always() && steps.filter.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debian_r818_sonic_lcd_uart0
          path: src/out/debian_r818_sonic_lcd_uart0.img
          retention-days: 3
          if-no-files-found: ignore
