name: Build Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
  schedule:
    # Catches drift from the live Debian mirror (debootstrap/apt pull
    # latest packages) breaking the build even with no local changes.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit runtime for the bundled dragon packer
        # prebuilt_kernel/tools/dragon (used by pack_img.sh) is a 32-bit
        # x86 ELF binary - ubuntu-latest doesn't have i386 library support
        # enabled by default, so it fails with a misleading
        # "No such file or directory" even though the file exists.
        # Documented in README.md's build troubleshooting section.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Install qemu-user-static and register aarch64 binfmt with PCF flags
        # Debian's default qemu-user-static binfmt registration is missing
        # flags the chroot install needs - same issue and same fix
        # documented in README.md's build troubleshooting section:
        #   - missing C (credentials): sudo silently fails inside the
        #     chroot, so Klipper/Moonraker/KlipperScreen/etc never
        #     actually get installed even though the build "succeeds"
        #   - missing P (preserve argv0): argument passing to emulated
        #     binaries breaks (e.g. "Illegal option --")
        # `update-binfmts --disable/--enable` does not reliably fix this -
        # manual re-registration is required.
        run: |
          set -e
          sudo apt-get install -y qemu-user-static
          echo -1 | sudo tee /proc/sys/fs/binfmt_misc/qemu-aarch64 >/dev/null || true
          printf ':qemu-aarch64:M::\x7f\x45\x4c\x46\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:PCF\n' \
            | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          grep -i '^flags' /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Run full build (create_rootfs + pack_img)
        working-directory: src
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # install_webui.sh prompts whether to also install Fluidd
          # alongside Mainsail - answer "no" so the build doesn't hang
          # waiting on stdin that will never come in CI.
          echo "n" | sudo -E ./build.sh

      - name: Verify output image exists
        working-directory: src
        run: |
          test -f out/debian_r818_sonic_lcd_uart0.img
          ls -lh out/debian_r818_sonic_lcd_uart0.img

      - name: Upload built image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debian_r818_sonic_lcd_uart0
          path: src/out/debian_r818_sonic_lcd_uart0.img
          retention-days: 3
          if-no-files-found: ignore
