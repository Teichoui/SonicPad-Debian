name: Build Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catches drift from the live Debian mirror (debootstrap/apt pull
    # latest packages) breaking the build even with no local changes.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether the build is actually affected
        # The job always runs (no path filter on the trigger) so this can
        # be used as a required status check - a path-filtered-out check
        # stays permanently pending on non-matching PRs and blocks merges
        # under branch protection. Instead, always report a status, and
        # only skip the expensive build steps when nothing that affects
        # the build changed (docs-only PRs, other workflows, etc). This
        # workflow file itself counts - a PR that breaks these commands
        # should not be able to merge with a green check that never
        # actually ran them.
        id: filter
        run: |
          PATHS=('src/**' '.github/workflows/build.yml')
          case "${{ github.event_name }}" in
            pull_request)
              changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "${PATHS[@]}")"
              ;;
            push)
              changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "${PATHS[@]}" 2>/dev/null || echo "${PATHS[0]}")"
              ;;
            *)
              changed="${PATHS[0]} (scheduled or manually dispatched run)"
              ;;
          esac
          if [ -n "$changed" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            echo "No src/** changes - skipping full build."
          fi

      - name: Free disk space
        if: steps.filter.outputs.run_build == 'true'
        # Verified via a real full run: the build got all the way through
        # installing Klipper/Moonraker/KlipperScreen/web UI (~25 minutes)
        # and then failed packing the final image with "No space left on
        # device". GitHub-hosted runners ship with large preinstalled
        # toolchains (dotnet, Android SDK, GHC, etc.) that eat most of the
        # free disk space by default and aren't needed for this build.
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          echo "After cleanup:"
          df -h /

      - name: Install 32-bit runtime for the bundled dragon packer
        if: steps.filter.outputs.run_build == 'true'
        # prebuilt_kernel/tools/dragon (used by pack_img.sh) is a 32-bit
        # x86 ELF binary - ubuntu-latest doesn't have i386 library support
        # enabled by default, so it fails with a misleading
        # "No such file or directory" even though the file exists.
        # Documented in README.md's build troubleshooting section.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: List all existing binfmt_misc registrations (no mutation)
        if: steps.filter.outputs.run_build == 'true'
        # Verified fact from a prior diagnostic run: the magic/mask bytes
        # extracted from Debian's own qemu-aarch64 entry are byte-for-byte
        # correct (confirmed via od -c) and correctly exclude x86_64 (the
        # e_machine field is checked with a full-byte mask). So the two
        # prior host-breaking failures were NOT caused by wrong magic/mask
        # values. Before writing anything, checking one more verifiable
        # fact: GitHub-hosted runners are documented to ship pre-configured
        # binfmt_misc support for other architectures (Docker buildx
        # multi-arch), which could mean multiple overlapping entries exist
        # and unregistering only "qemu-aarch64" doesn't remove all of them.
        run: |
          echo "=== all binfmt_misc entries ==="
          ls -la /proc/sys/fs/binfmt_misc/
          for f in /proc/sys/fs/binfmt_misc/qemu-*; do
            echo "--- $f ---"
            cat "$f" 2>&1 || true
          done

      - name: Add the credentials (C) flag, with an immediate self-test and auto-revert
        if: steps.filter.outputs.run_build == 'true'
        # Two prior attempts to add the C flag broke the runner's own host
        # binaries (grep, then node), even though the magic/mask bytes
        # themselves are verified correct. The exact remaining mechanism
        # is unconfirmed, so this write no longer just trusts itself: it
        # tests execution immediately with a cheap external binary
        # (/bin/true) right after registering, and if that fails, it
        # unregisters itself immediately and exits with a clear error -
        # rather than leaving a broken registration active for every
        # subsequent step in the job, which is what made both prior
        # failures cascade into breaking the Actions runner's own tooling.
        run: |
          set -e
          sudo apt-get install -y qemu-user-static
          entry=/proc/sys/fs/binfmt_misc/qemu-aarch64
          test -f "$entry" || { echo "qemu-aarch64 binfmt entry not found after installing qemu-user-static"; exit 1; }

          declare interpreter="" flags="" offset="" magic="" mask=""
          while read -r key value; do
            case "$key" in
              interpreter) interpreter="$value" ;;
              flags:) flags="$value" ;;
              offset) offset="$value" ;;
              magic) magic="$value" ;;
              mask) mask="$value" ;;
            esac
          done < "$entry"
          echo "Parsed: interpreter=$interpreter flags=$flags offset=$offset magic=$magic mask=$mask"

          # README.md documents PCF as the minimum required flag set.
          new_flags="$flags"
          case "$new_flags" in *P*) ;; *) new_flags="${new_flags}P" ;; esac
          case "$new_flags" in *C*) ;; *) new_flags="${new_flags}C" ;; esac
          case "$new_flags" in *F*) ;; *) new_flags="${new_flags}F" ;; esac
          if [ "$new_flags" = "$flags" ]; then
            echo "P, C and F flags already present ($flags), nothing to do."
            exit 0
          fi
          [ -n "$magic" ] && [ -n "$mask" ] && [ -n "$interpreter" ] || { echo "Failed to parse $entry"; exit 1; }

          magic_esc=$(echo "$magic" | sed 's/\(..\)/\\x\1/g')
          mask_esc=$(echo "$mask" | sed 's/\(..\)/\\x\1/g')
          new_entry=":qemu-aarch64:M::${magic_esc}:${mask_esc}:${interpreter}:${new_flags}"
          echo "Writing: $new_entry"

          # binfmt_misc's register interface needs the whole entry in a
          # single write() syscall - README.md's own already-validated
          # fix (from earlier real debugging this session) writes to a
          # temp file first and cats that in, rather than piping through
          # tee, for exactly this reason. Matching that exactly rather
          # than the pipe form used in the two prior (failed) attempts.
          printf '%s\n' "$new_entry" > /tmp/binfmt_regfix.txt
          sudo sh -c 'echo -1 > '"$entry"
          sudo sh -c 'cat /tmp/binfmt_regfix.txt > /proc/sys/fs/binfmt_misc/register'

          echo "Self-test: running grep --version (grep is the exact binary that broke in both prior attempts)..."
          if grep --version >/dev/null; then
            echo "Self-test passed."
          else
            echo "Self-test FAILED - reverting registration immediately."
            sudo sh -c 'echo -1 > '"$entry" || true
            exit 1
          fi

      - name: Run full build (create_rootfs + pack_img)
        if: steps.filter.outputs.run_build == 'true'
        working-directory: src
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # install_webui.sh prompts whether to also install Fluidd
          # alongside Mainsail - answer "no" so the build doesn't hang
          # waiting on stdin that will never come in CI.
          echo "n" | sudo -E ./build.sh

      - name: Verify output image exists
        if: steps.filter.outputs.run_build == 'true'
        working-directory: src
        run: |
          test -f out/debian_r818_sonic_lcd_uart0.img
          ls -lh out/debian_r818_sonic_lcd_uart0.img

      - name: Upload built image
        if: always() && steps.filter.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debian_r818_sonic_lcd_uart0
          path: src/out/debian_r818_sonic_lcd_uart0.img
          retention-days: 3
          if-no-files-found: ignore
